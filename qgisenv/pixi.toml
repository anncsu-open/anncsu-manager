channels = ["conda-forge"]
name = "qgis-parquet"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
qgis = ">=3.44.3,<4"
libgdal-arrow-parquet = ">=3.11.4,<4"
